<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Coin Gold Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#ringGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Outer Cyber Orbit Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="24 12" opacity="0.6" />
  
  <!-- Outer Gold Coin Border -->
  <circle cx="256" cy="256" r="148" fill="#131e38" stroke="url(#goldGrad)" stroke-width="12" filter="url(#subtleGlow)" />

  <!-- Inner Coin Ridge -->
  <circle cx="256" cy="256" r="126" fill="#0d1527" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.8" />

  <!-- Play Symbol (Video Ad / Gaming reward) -->
  <polygon points="220,186 330,256 220,326" fill="url(#playGrad)" filter="url(#glow)" />
  <polygon points="220,186 330,256 220,326" fill="url(#playGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

  <!-- Lightning / Fast Payout Sparkles -->
  <circle cx="350" cy="160" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="150" cy="340" r="6" fill="#10b981" filter="url(#glow)" />
  <circle cx="370" cy="320" r="5" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="160" cy="180" r="7" fill="#818cf8" filter="url(#glow)" />

  <!-- Dollar/Crypto Diamond Accent at Top -->
  <path d="M 256 142 L 264 154 L 256 166 L 248 154 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
</svg>
